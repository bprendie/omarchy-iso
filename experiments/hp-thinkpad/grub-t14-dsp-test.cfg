# Experimental ARM-only A/B menu. Both entries use the same existing UKI.
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod font
if loadfont "${prefix}/fonts/unicode.pf2"; then
    insmod all_video
    set gfxmode=auto
    terminal_output gfxterm
fi
terminal_input console
set timeout=10
set timeout_style=menu
set default=t14-dsp

menuentry 'T14 test: allow early DSP startup' --id t14-dsp {
    chainloader /arch/boot/aarch64/omarchy-live.efi archisobasedir=arch archisosearchuuid=2026-09-21-16-35-52-00 rootdelay=30 console=tty0 loglevel=6 disablehooks=plymouth dragon.bootdiag=1 initramfs_async=0 clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.tpm2_wait=0
}

menuentry 'Previous behavior: block early DSP startup' --id t14-baseline {
    chainloader /arch/boot/aarch64/omarchy-live.efi archisobasedir=arch archisosearchuuid=2026-09-21-16-35-52-00 rootdelay=30 console=tty0 loglevel=6 disablehooks=plymouth dragon.bootdiag=1 initramfs_async=0 clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.tpm2_wait=0 modprobe.blacklist=qcom_q6v5_pas
}

menuentry 'UEFI firmware settings' {
    fwsetup
}
